AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  FieldProof backend (PRD 30) - API on Lambda + HTTP API, workflow worker on
  Lambda driven by EventBridge, state in one DynamoDB table, evidence in S3.

Parameters:
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    Description: Multimodal model used by the Evidence Agent.
  ApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Bearer token required on every /api route. Empty disables the check.
  CorsOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Web client origin allowed to call the API and upload to S3.
  WorkflowReservedConcurrency:
    Type: Number
    Default: -1
    Description: >
      Reserved concurrency for the workflow worker, or -1 to leave it unset.
      New accounts have a total Lambda concurrency of 10 and must keep 10
      unreserved, so any reservation fails there. Set it once your account's
      concurrency quota has been raised.

Conditions:
  HasApiKey: !Not [!Equals [!Ref ApiKey, ""]]
  HasReservedConcurrency: !Not [!Equals [!Ref WorkflowReservedConcurrency, -1]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 1024
    CodeUri: ../../
    Environment:
      Variables:
        FIELDPROOF_MODE: aws
        FIELDPROOF_STUB_AGENTS: "0"
        FIELDPROOF_TABLE_NAME: !Ref Table
        FIELDPROOF_BUCKET_NAME: !Ref EvidenceBucket
        FIELDPROOF_EVENT_BUS: !Ref EventBus
        FIELDPROOF_CORS_ORIGINS: !Ref CorsOrigin
        FIELDPROOF_API_KEY: !If [HasApiKey, !Ref ApiKey, !Ref AWS::NoValue]
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !Ref AWS::Region

Resources:
  # -- State (PRD 22: single-table design) ------------------------------------
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # -- Evidence (PRD 34: private bucket, signed URLs only) ---------------------
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: [!Ref CorsOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  # -- Events (PRD 19) ----------------------------------------------------------
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub fieldproof-${AWS::StackName}

  # -- API -----------------------------------------------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata: { BuildMethod: makefile }
    Properties:
      Handler: infra.aws.lambda_handlers.api_handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref EvidenceBucket }
        - EventBridgePutEventsPolicy: { EventBusName: !Ref EventBus }
      Events:
        Http:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        Health:
          Type: HttpApi
          Properties: { Path: /health, Method: GET }

  # -- Workflow worker (PRD 11, 17) ------------------------------------------------
  WorkflowFunction:
    Type: AWS::Serverless::Function
    Metadata: { BuildMethod: makefile }
    Properties:
      Handler: infra.aws.lambda_handlers.workflow_handler
      Timeout: 900
      # Runs are already serialized per job by the DynamoDB lock; a reservation
      # only caps cost. Unset by default so the stack deploys on a new account.
      ReservedConcurrentExecutions: !If
        - HasReservedConcurrency
        - !Ref WorkflowReservedConcurrency
        - !Ref AWS::NoValue
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref EvidenceBucket }
        - EventBridgePutEventsPolicy: { EventBusName: !Ref EventBus }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"
            - Effect: Allow
              Action: [transcribe:StartTranscriptionJob, transcribe:GetTranscriptionJob]
              Resource: "*"
      Events:
        Triggers:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source: [fieldproof]
              detail-type:
                - JOB_COMPLETED
                - EVIDENCE_UPLOADED
                - DECISION_RESOLVED
                - WORKFLOW_RETRY_REQUESTED
            RetryPolicy:
              MaximumRetryAttempts: 3
              MaximumEventAgeInSeconds: 3600

Outputs:
  ApiUrl:
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref EvidenceBucket
  EventBusName:
    Value: !Ref EventBus
