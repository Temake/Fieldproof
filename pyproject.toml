[project]
name = "fieldproof"
version = "0.1.0"
description = "FieldProof - autonomous job closeout agent for field-service teams"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Teminioluwa Adekoya" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Agent runtime. Kept optional so the deterministic core installs and tests
# without pulling the Bedrock/Strands stack.
agents = [
    "strands-agents>=1.0",
    "bedrock-agentcore>=1.0",
    "boto3>=1.34",
]
# Real AWS adapters (DynamoDB / S3 / EventBridge).
aws = ["boto3>=1.34"]
# Lambda entry points (infra/aws).
lambda = ["mangum>=0.17", "boto3>=1.34"]
# The `agentcore` CLI that deploys agents/agentcore_app.py to AgentCore Runtime.
# Separate from bedrock-agentcore, which is the runtime SDK the app imports.
# >=0.3 for the `agentcore deploy` command; 0.1.x called it `launch`.
agentcore = ["bedrock-agentcore-starter-toolkit>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "moto[dynamodb,s3,events,sqs]>=5.0",
    "cfn-lint>=1.0",
    "strands-agents>=1.0",
    "bedrock-agentcore>=1.0",
    "mangum>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["domain", "tools", "agents", "infra", "apps/api/fieldproof_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Starlette's TestClient still uses an alias anyio has deprecated.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # bedrock-agentcore's own pydantic models use class-based config.
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning:bedrock_agentcore",
]

[tool.ruff]
line-length = 100
target-version = "py311"
